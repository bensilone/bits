services:
  postgres:
    image: postgres:16-alpine
    container_name: sparks-postgres
    environment:
      POSTGRES_USER: sparks
      POSTGRES_PASSWORD: sparks
      POSTGRES_DB: sparks
    ports:
      - "5432:5432"
    volumes:
      - sparks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparks -d sparks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sparks_pgdata:
